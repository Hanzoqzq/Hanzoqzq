<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#8a5cff"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00f0ff"/>
    <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#1b2230" stroke-width="1"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="30 30" dur="4s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#8a5cff" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="type">
    <rect x="40" y="165" height="30" width="0">
      <animate attributeName="width" values="0;330;330;0" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="frame"><rect width="900" height="280" rx="14"/></clipPath>
</defs>
<style>
  text{font-family:"Courier New",Courier,monospace}
  .g1{animation:gl1 4s infinite}
  .g2{animation:gl2 4s infinite}
  @keyframes gl1{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(-5px,1px)}93%{transform:translate(4px,-2px)}95%{transform:translate(-2px,2px)}97%{transform:translate(0,0)}}
  @keyframes gl2{0%,90%,100%{transform:translate(0,0)}91%{transform:translate(5px,-1px)}93%{transform:translate(-4px,2px)}95%{transform:translate(3px,-2px)}97%{transform:translate(0,0)}}
  .blink{animation:bl 1s steps(2) infinite}
  @keyframes bl{50%{opacity:0}}
</style>

<g clip-path="url(#frame)">
  <rect width="900" height="280" fill="#0a0c11"/>
  <rect width="900" height="280" fill="url(#grid)"/>
  <circle cx="760" cy="140" r="150" fill="url(#glow)"/>

  <text x="40" y="52" font-size="13" fill="#5c6b82">hanzo@termux:~$ <tspan fill="#8a97ab">whoami</tspan></text>
  <circle cx="860" cy="46" r="4" fill="#27ff7a"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="846" y="50" font-size="12" fill="#5c6b82" text-anchor="end">online</text>

  <g font-size="86" font-weight="bold" letter-spacing="6">
    <text class="g1" x="40" y="145" fill="#00f0ff" opacity="0.7">HANZO</text>
    <text class="g2" x="40" y="145" fill="#ff2e88" opacity="0.7">HANZO</text>
    <text x="40" y="145" fill="url(#g)">HANZO</text>
  </g>

  <g clip-path="url(#type)">
    <text x="42" y="187" font-size="20" fill="#d7e0ee">&gt; WhatsApp Bot Developer</text>
  </g>
  <rect class="blink" x="0" y="169" width="10" height="20" fill="#00f0ff">
    <animate attributeName="x" values="42;372;372;42" keyTimes="0;0.4;0.9;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <text x="42" y="228" font-size="13" fill="#5c6b82">node.js  /  baileys  /  pterodactyl  /  termux</text>

  <g>
    <circle cx="760" cy="140" r="70" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 760 140" to="360 760 140" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="140" r="52" fill="none" stroke="#8a5cff" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360 760 140" to="0 760 140" dur="9s" repeatCount="indefinite"/>
    </circle>
    <polygon points="760,112 784.2,126 784.2,154 760,168 735.8,154 735.8,126" fill="none" stroke="url(#g)" stroke-width="2">
      <animate attributeName="stroke-width" values="2;4;2" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <circle r="4" fill="#00f0ff">
      <animateMotion dur="5s" repeatCount="indefinite" path="M690,140 a70,70 0 1,0 140,0 a70,70 0 1,0 -140,0"/>
    </circle>
  </g>

  <g font-size="16" fill="#3a4a63">
    <text x="640" y="90">&lt;/&gt;<animate attributeName="y" values="90;70;90" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/></text>
    <text x="850" y="220">{ }<animate attributeName="y" values="220;200;220" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/></text>
    <text x="660" y="235">0x1F<animate attributeName="y" values="235;215;235" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/></text>
    <text x="845" y="95">;<animate attributeName="y" values="95;75;95" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/></text>
  </g>

  <rect y="0" width="900" height="3" fill="#00f0ff" opacity="0.08">
    <animate attributeName="y" values="-5;285" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <line x1="0" y1="262" x2="900" y2="262" stroke="#1b2230" stroke-width="2"/>
  <rect x="-200" y="260" width="200" height="4" fill="url(#sweep)">
    <animate attributeName="x" values="-200;900" dur="3s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="1" y="1" width="898" height="278" rx="14" fill="none" stroke="#1b2230" stroke-width="2"/>
</svg>
